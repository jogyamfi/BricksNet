name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Monday at 08:00 UTC.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  vulnerable-packages:
    name: Vulnerable NuGet packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Install exactly the SDK pinned by global.json at the repository root.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BricksNet.sln

      - name: Check for vulnerable packages
        # Exit code 1 if any known vulnerabilities are found.
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt ; grep -q "has the following vulnerable packages" vuln-report.txt && exit 1 || exit 0

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vuln-report
          path: vuln-report.txt

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main, 2025-12-10
        with:
          project: BricksNet
          path: src
          format: HTML
          # Fail the job on CVSS score >= 7 (high/critical).
          # Documented false positives live in dependency-check-suppressions.xml.
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression dependency-check-suppressions.xml

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-report
          path: reports/
