name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows too: the OAuth PKCE flow (loopback listener, browser launch) and file paths are
        # platform-sensitive. Coverage, packing and package verification run on Linux only.
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for Source Link to embed correct commit SHAs.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Install exactly the SDK pinned by global.json at the repository root.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BricksNet.sln

      - name: Build
        run: dotnet build BricksNet.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test BricksNet.sln
          --no-build -c Release
          --filter "Category!=E2E"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-out

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          directory: coverage-out
          flags: unittests
          fail_ci_if_error: false

      # Pack and verify on every PR so packaging problems show up before a release.
      # Publishing happens only in release.yml, on a v* tag.
      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack BricksNet.sln -c Release --no-build -o ./nupkgs

      - name: Verify packages
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          # Authenticates the Source Link check's requests to GitHub, avoiding anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Test-Packages.ps1 -NoPack -PackageDirectory ./nupkgs

      - name: Upload NuGet artifacts
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: nupkgs/
