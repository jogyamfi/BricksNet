name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bricksnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed for Source Link to embed correct commit SHAs.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BricksNet.sln

      - name: Build
        run: dotnet build BricksNet.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test BricksNet.sln
          --no-build -c Release
          --filter "Category!=E2E"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage-out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: bricksnet/coverage-out
          flags: unittests
          fail_ci_if_error: false

      - name: Pack (main branch only)
        if: github.ref == 'refs/heads/main'
        run: dotnet pack src/BricksNet -c Release --no-build -o ./nupkgs

      - name: Upload NuGet artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: bricksnet/nupkgs/
