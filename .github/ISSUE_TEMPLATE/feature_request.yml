name: Feature request
description: Suggest a new capability or an API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behaviour you would like. A code sketch helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
